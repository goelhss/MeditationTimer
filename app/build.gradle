import java.util.Properties

plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("signing/keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.vishalgoel.meditationtimer"
    compileSdk 35

    defaultConfig {
        applicationId "com.vishalgoel.meditationtimer"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"] as String)
                storePassword keystoreProperties["storePassword"] as String
                keyAlias keystoreProperties["keyAlias"] as String
                keyPassword keystoreProperties["keyPassword"] as String
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
